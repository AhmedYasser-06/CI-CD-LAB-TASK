    <title>CI/CD Lab Task</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #1a0a2e, #0d0d0d);
        font-family: system-ui, sans-serif;
        color: #f0f0f0;
      }
      h1 {
        margin-bottom: 2rem;
        font-size: 2rem;
        color: #e8a040;
        letter-spacing: 0.05em;
      }
      table {
        border-collapse: collapse;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        overflow: hidden;
      }
      th {
        background: #e8a040;
        color: #1a0a2e;
        padding: 14px 32px;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
      }
      td {
        padding: 12px 32px;
        background: #1e1230;
        border-bottom: 1px solid #2a1845;
      }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: #2a1845; }
    </style>
  </head>
